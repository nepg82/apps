<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metasyntactic Variable</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>

<script>
"use strict";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const chars = "           .,:;irsXA253hMHGS#9B&@";
const fontSize = 15;
let cols, rows;
let cellW, cellH;
let startTime = performance.now();

// Wave velocity: +1 = left-to-right / top-to-bottom.
// -1 = right-to-left / bottom-to-top.
let directionX = -1;
let directionY = 0;

// Swipe tracking.
let swipeStartX = 0;
let swipeStartY = 0;
let swipeTracking = false;

const ripples = [];

function addRipple(x, y) {
  ripples.push({
    x,
    y,
    born: performance.now(),
    strength: 1
  });

  // Don't let hundreds of taps accumulate forever.
  if (ripples.length > 12) {
    ripples.shift();
  }
}

let longPressTimer = null;
let longPressTriggered = false;

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  longPressTriggered = false;
  swipeTracking = true;
  swipeStartX = event.clientX;
  swipeStartY = event.clientY;

  // Capture the pointer so we continue receiving pointerup/cancel.
  canvas.setPointerCapture(event.pointerId);

  longPressTimer = setTimeout(async () => {
    // Only treat it as a long press if the finger hasn't moved.
    if (!swipeTracking) return;

    longPressTriggered = true;

    if (!document.fullscreenElement) {
      try {
        await document.documentElement.requestFullscreen();
      } catch (err) {
        console.log("Fullscreen unavailable:", err);
      }
    }
  }, 700);
});

canvas.addEventListener("pointermove", (event) => {
  if (!swipeTracking) return;

  const dx = event.clientX - swipeStartX;
  const dy = event.clientY - swipeStartY;

  // 40px threshold keeps ordinary taps from becoming swipes.
  if (Math.hypot(dx, dy) < 40) return;

  swipeTracking = false;
  clearTimeout(longPressTimer);
  longPressTimer = null;

  // Whichever axis has the larger movement determines the direction.
  if (Math.abs(dx) > Math.abs(dy)) {
    directionX = Math.sign(dx);
    directionY = 0;
  } else {
    directionX = 0;
    directionY = Math.sign(dy);
  }
});

canvas.addEventListener("pointerup", (event) => {
  clearTimeout(longPressTimer);
  longPressTimer = null;

  // A normal tap creates a ripple. A swipe does not.
  if (swipeTracking && !longPressTriggered) {
    addRipple(event.clientX, event.clientY);
  }

  swipeTracking = false;
});

canvas.addEventListener("pointercancel", () => {
  clearTimeout(longPressTimer);
  longPressTimer = null;
  longPressTriggered = false;
  swipeTracking = false;
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${fontSize}px "Courier New", monospace`;
  ctx.textBaseline = "top";

  cellW = fontSize * 0.62;
  cellH = fontSize * 1.05;
  cols = Math.ceil(innerWidth / cellW) + 1;
  rows = Math.ceil(innerHeight / cellH) + 1;
}

function wave(x, y, t, rippleData) {
  let a =
      Math.sin(x * 0.075 - directionX * t * 1.25) +
      Math.sin(y * 0.095 - directionY * t * 0.90) +
      Math.sin(
        (x * (directionX || 1) + y * (directionY || 1)) * 0.045 +
        t * 0.70
      ) +
      Math.sin(Math.hypot(x - 700, y - 420) * 0.055 - t * 1.15);

  a /= 4;

  // Add disturbances created by taps.
  for (const data of rippleData) {
    const age = data.age;
	const distance = Math.hypot(x - data.ripple.x, y - data.ripple.y);

    // Ripple expands outward.
    const radius = data.radius;

    // Thin ring around the expanding wave.
    const ring = Math.exp(
      -Math.pow((distance - radius) / 45, 2)
    );

    // Ripple gradually fades.
    const fade = Math.exp(-age * 1.8);

    a += ring * fade * 0.9;
  }

  return Math.max(-1, Math.min(1, a));
}

function draw(now) {
  const t = (now - startTime) / 1000;
  
  const rippleData = ripples.map(ripple => ({
    ripple,
    age: (now - ripple.born) / 1000,
    radius: ((now - ripple.born) / 1000) * 500
  }));

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  ctx.font = `${fontSize}px "Courier New", monospace`;

  for (let row = 0; row < rows; row++) {
    const y = row * cellH;

    for (let col = 0; col < cols; col++) {
      const x = col * cellW;

      let v = wave(x, y, t, rippleData);

      // Add a slow secondary distortion.
      v += 0.18 * Math.sin(
        x * 0.018 - y * 0.031 +
        (directionX * 0.7 + directionY * 0.7) * t * 0.55
      );
      v = Math.max(-1, Math.min(1, v));

      // Convert wave intensity into a character.
      const index = Math.floor((v + 1) * 0.5 * (chars.length - 1));
      const ch = chars[index];

      if (ch === " ") continue;

      // Color follows the wave phase.
      let hue = (190 + v * 110 + t * 22) % 360;
	  let light = 42 + Math.abs(v) * 24;

	  // Make recently-tapped areas glow.
	  for (const data of rippleData) {
	    const age = data.age;
	    const distance = Math.hypot(
	      x - data.ripple.x,
	      y - data.ripple.y
	    );

	    const hotspot =
	      Math.exp(-Math.pow(distance / 180, 2)) *
	      Math.exp(-age * 1.5);

	    light += hotspot * 35;
	    hue += hotspot * 80;
	  }

	  ctx.fillStyle = `hsl(${hue % 360}, 90%, ${Math.min(light, 90)}%)`;
      ctx.fillText(ch, x, y);
    }
  }

  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
setTimeout(() => requestAnimationFrame(draw), 1000 / 30);

</script>
</body>
</html>
